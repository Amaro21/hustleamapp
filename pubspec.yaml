name: hustleamapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  device_preview: ^1.3.1
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  shared_preferences: ^2.2.0
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.1.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  http: ^1.2.1
  http_parser: ^4.0.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  sqflite: ^2.3.3+1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.4"
  flutter_lints: ^5.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo1.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/